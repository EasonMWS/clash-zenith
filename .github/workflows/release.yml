name: release

# Pushing a tag like v1.0.0 builds Zenith.exe and attaches it to a GitHub
# Release, so somebody who does not want to install Go can download a ready
# binary instead of cloning and building.
#
# The executable is deliberately NOT committed to the repository: a binary in
# git history grows with every rebuild, and a stale one is worse than none.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Icon resource
        shell: pwsh
        run: |
          # icon.syso is committed, so this is a no-op unless the .ico changed.
          # Regenerating keeps the executable's icon in step with the source.
          if (-not (Test-Path src/icon.syso)) {
            go install github.com/akavel/rsrc@latest
            $rsrc = Join-Path $env:USERPROFILE 'go\bin\rsrc.exe'
            & $rsrc -ico data/zenith.ico -o src/icon.syso -arch amd64
          }

      - name: Regression tests
        working-directory: src
        shell: pwsh
        run: |
          # These cover the defects a review found - the unreachable watchdog
          # entry, the health-map race, the slow-node counter that never counted,
          # the TUN component check, loopback and token enforcement, and the
          # refusal to download a subscription over plain http. A release must not
          # be produced from a tree where any of them fails.
          $env:CGO_ENABLED = '0'
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "go vet failed" }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Build
        working-directory: src
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../Zenith.exe .
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Verify the TUN component is the verified one
        shell: pwsh
        run: |
          # The component manifest records the digest the build was tested against.
          # Checking it here means a release cannot ship a substituted or corrupted
          # driver, and the check is by content rather than by file name.
          $m = Get-Content 'core/wintun/manifest.json' -Raw | ConvertFrom-Json
          $c = $m.components[0]
          if (-not (Test-Path $c.file)) { throw "component missing: $($c.file)" }
          $actual = (Get-FileHash $c.file -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $c.sha256.ToLower()) {
            throw "component digest mismatch: manifest $($c.sha256), actual $actual"
          }
          $sig = Get-AuthenticodeSignature $c.file
          if ($sig.Status -ne 'Valid') { throw "component signature is not valid: $($sig.Status)" }
          Write-Host "component $($c.name) $($c.version) verified, signed by $($sig.SignerCertificate.Subject)"

      - name: Smoke test
        shell: pwsh
        run: |
          $v = & .\Zenith.exe -version
          Write-Host $v
          if ($v -notmatch 'Zenith') { throw "the binary does not run" }
          # The watchdog entry must be reachable. It used to sit after flag.Parse,
          # which exits on an unknown flag, so the helper died on its own argument
          # and the crash protection silently did not exist.
          & .\Zenith.exe -watchdog "$env:TEMP\zenith-smoke" 7999
          if ($LASTEXITCODE -ne 0) { throw "the watchdog entry point is not reachable" }
          Write-Host "watchdog entry point is reachable"

      - name: Package
        shell: pwsh
        run: |
          # ship the whole runnable tree; the user unzips and double clicks
          $stage = 'Zenith-windows-amd64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'Zenith.exe' $stage
          Copy-Item 'README.md','LICENSE' $stage
          Copy-Item 'core'   $stage -Recurse
          Copy-Item 'web'    $stage -Recurse
          Copy-Item 'docs'   $stage -Recurse
          New-Item -ItemType Directory -Force -Path "$stage/data" | Out-Null
          Copy-Item 'data/GeoSite.dat','data/geoip.metadb','data/zenith.ico' "$stage/data"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag 'Zenith-windows-amd64.zip' --clobber

      - name: Keep the zip as a build artifact too
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-windows-amd64
          path: Zenith-windows-amd64.zip
